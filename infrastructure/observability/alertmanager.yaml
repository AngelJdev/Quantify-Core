global:
  resolve_timeout: 15s
route:
  receiver: isolated-test-receipt
  group_by: [alertname, environment]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
receivers:
  - name: isolated-test-receipt
    webhook_configs:
      - url: http://alert-receiver:9194/alerts
        send_resolved: true
