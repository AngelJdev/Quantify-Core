global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: local-review
rule_files:
  - /etc/prometheus/alerts.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: core-api
    static_configs:
      - targets: [api:9464]
    scrape_timeout: 3s
