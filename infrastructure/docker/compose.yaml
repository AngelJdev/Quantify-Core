name: quantify-core-dev
services:
  api:
    profiles: [app]
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unversioned}
    image: quantify-core-api:${APP_REVISION:-local-review}
    environment:
      DATABASE_URL: postgresql://quantify_api:${CORE_RUNTIME_PASSWORD:?Run init}@postgres:5432/quantify_core_dev
      KEYCLOAK_ISSUER: http://localhost:8180/realms/quantify
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/quantify/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: quantify-api
      HOST: 0.0.0.0
      PORT: "3000"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORE_REVIEW_WRITES_ENABLED: ${CORE_REVIEW_WRITES_ENABLED:-0}
      OBSERVABILITY_ENABLED: "1"
      METRICS_HOST: 0.0.0.0
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: quantify_core_dev
      POSTGRES_USER: quantify_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/dev-base.mjs init}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U quantify_owner -d quantify_core_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Run init}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Run init}
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../keycloak/realm-export.json:/opt/keycloak/data/import/quantify-realm.json:ro
volumes:
  postgres-data:
  keycloak-data:
