<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="title desc"><title id="title">Verifica tu correo</title><desc id="desc">OTP de seis dígitos como propuesta que requiere personalización · wireframe light · propuesta sin implementación</desc><rect x="0" y="0" width="390" height="844" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><rect x="24" y="28" width="44" height="44" rx="12" fill="#777777" stroke="#777777" stroke-width="1"/><text x="46" y="57" font-family="Arial, sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" text-anchor="middle">Q</text><text x="83" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222222" text-anchor="start">QUANTIFY CORE</text><text x="83" y="65" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#666666" text-anchor="start">IDENTIDAD · KEYCLOAK</text><text x="24" y="118" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#666666" text-anchor="start">ACCESO SEGURO · RF-01</text><text x="24" y="160" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#222222" text-anchor="start">Verifica tu correo</text><text x="24" y="192" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#666666" text-anchor="start">Escribe el código enviado a tu correo.</text><text x="34" y="264" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#222222" text-anchor="start">Código de verificación</text><text x="34" y="293" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#666666" text-anchor="start">Introduce los 6 dígitos recibidos.</text><rect x="24" y="328" width="52" height="63" rx="10" fill="#F2F2F2" stroke="#888888" stroke-width="1"/><rect x="82" y="328" width="52" height="63" rx="10" fill="#F2F2F2" stroke="#888888" stroke-width="1"/><rect x="140" y="328" width="52" height="63" rx="10" fill="#F2F2F2" stroke="#888888" stroke-width="1"/><rect x="198" y="328" width="52" height="63" rx="10" fill="#F2F2F2" stroke="#888888" stroke-width="1"/><rect x="256" y="328" width="52" height="63" rx="10" fill="#F2F2F2" stroke="#888888" stroke-width="1"/><rect x="314" y="328" width="52" height="63" rx="10" fill="#F2F2F2" stroke="#888888" stroke-width="1"/><rect x="24" y="447" width="342" height="51" rx="11" fill="#777777" stroke="#777777" stroke-width="1"/><text x="195" y="479" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Verificar código</text><rect x="24" y="512" width="342" height="51" rx="11" fill="#F2F2F2" stroke="#888888" stroke-width="1"/><text x="195" y="544" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#222222" text-anchor="middle">Reenviar código</text><text x="195" y="613" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="middle">Si no llega, revisa spam y espera para reenviar.</text><text x="195" y="645" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="middle">Código incorrecto o vencido: solicita otro.</text><text x="195" y="759" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="middle">Prototipo UI · Sin integración de identidad</text><text x="195" y="784" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" text-anchor="middle">AUTH · U05</text></svg>
