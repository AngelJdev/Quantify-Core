<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quantify Core · Flujo de autenticación</title><style>body{margin:0;background:#0B0F17;color:#fff;font:16px Inter,system-ui,sans-serif}header,main{max-width:1150px;margin:auto;padding:26px 18px}p{color:#cad7ee;line-height:1.5}a{color:#93b7ff}select{padding:9px;background:#161F2E;color:#fff;border:1px solid #8A99AD;border-radius:7px}label{margin-right:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:20px;margin-top:25px}.card{border:1px solid #455a77;border-radius:16px;padding:15px;background:#161F2E}.card img{width:100%;max-width:290px;display:block;margin:auto;border-radius:10px}h2{font-size:18px}</style></head><body><header><p>QUANTIFY CORE · RF-01</p><h1>Identidad y acceso</h1><p>Seis pantallas complementarias · Sketches, wireframes y mockups en dos temas. Diseño propuesto, sin conexión real a Keycloak.</p><a href="README.md">Documentación, flujos y límites</a> · <a href="../README.md">Volver al inventario móvil</a></header><main><label>Fidelidad <select id="stage"><option value="sketch">Sketch</option><option value="wireframe">Wireframe</option><option value="mockup" selected>Mockup</option></select></label><label>Tema <select id="theme"><option value="light">Claro</option><option value="dark">Oscuro</option></select></label><section class="grid" id="grid" aria-live="polite"></section></main><script>const screens=[{"id":"inicio-sesion","name":"Inicio de sesión","ref":"U02"},{"id":"crear-cuenta","name":"Crear cuenta","ref":"U03"},{"id":"verificar-correo","name":"Código de verificación","ref":"U05"},{"id":"recuperar-acceso","name":"Olvidé mi contraseña","ref":"U04"},{"id":"nueva-contrasena","name":"Nueva contraseña","ref":"U15"},{"id":"acceso-confirmado","name":"Confirmación de acceso","ref":"U05/U15"}],stage=document.querySelector('#stage'),theme=document.querySelector('#theme'),grid=document.querySelector('#grid');function render(){grid.replaceChildren();theme.disabled=stage.value!=='mockup';for(const s of screens){const sub=stage.value==='mockup'?'mockups/'+theme.value:stage.value==='sketch'?'sketches':'wireframes';const src='../'+sub+'/auth-'+s.id+'.svg';const card=document.createElement('article');card.className='card';const heading=document.createElement('h2');heading.textContent=s.name+' · '+s.ref;const image=document.createElement('img');image.src=src;image.alt=s.name+' ('+stage.value+')';image.loading='lazy';const link=document.createElement('a');link.href=src;link.textContent='Abrir SVG editable';card.append(heading,image,link);grid.append(card);}}stage.addEventListener('change',render);theme.addEventListener('change',render);render();</script></body></html>
