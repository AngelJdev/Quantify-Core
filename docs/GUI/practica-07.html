<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sketches · Quantify Core</title>
    <link rel="stylesheet" href="../practica-07/entrega.css" />
    <link rel="stylesheet" href="../../assets/portal/sketches.css" />
    <script src="../practica-07/data.js" defer></script>
    <script src="../practica-07/entrega.js" defer></script>
    <script src="../../assets/portal/sketches.js" defer></script>
  <!-- qc-shared-start --><link rel="stylesheet" href="../../assets/portal/site.css?v=20261116-blue-motion"><script src="../../assets/portal/site.js" defer></script><!-- qc-shared-end --></head>
  <body data-page="gallery" data-base="../practica-07/">
    <main class="sketch-workspace" id="sketch-workspace">
      <div class="sketch-heading">
        <div>
          <span class="sketch-kicker">DISEÑO / SKETCHES</span>
          <h1>Bocetos de Quantify Core</h1>
        </div>
        <p id="count" role="status"></p>
      </div>
      <div class="sketch-toolbar">
        <label
          >Rol<select id="role-filter">
            <option value="all">Todos</option>
            <option value="usuario">Usuario / visitante</option>
            <option value="admin">Administrador</option>
          </select></label
        >
        <label
          >Formato<select id="format-filter">
            <option value="movil">Móvil · 390 × 844</option>
            <option value="pwa">PWA · 1280 × 900</option>
          </select></label
        >
        <div class="sketch-stepper">
          <button
            id="previous-sketch"
            type="button"
            aria-label="Boceto anterior"
          >
            ←</button
          ><label>Pantalla<select id="screen-picker"></select></label
          ><button id="next-sketch" type="button" aria-label="Boceto siguiente">
            →
          </button>
        </div>
        <div class="sketch-view-controls" aria-label="Tamaño del boceto">
          <button id="fit-sketch" type="button" aria-pressed="true">
            Ajustar</button
          ><button id="zoom-sketch" type="button" aria-pressed="false">
            Ampliar</button
          ><button id="fullscreen-sketch" type="button">
            Pantalla completa
          </button>
        </div>
      </div>
      <div class="grid" id="catalog"></div>
    </main>
  </body>
</html>
